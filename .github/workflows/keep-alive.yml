name: Keep Supabase Awake

on:
  schedule:
    # 매일 00:00 UTC. Supabase 무료 플랜은 일정 기간 요청이 없으면 자동으로
    # 일시정지되는데, 이 프로젝트는 my-community/trash-day/guestbook과도
    # 함께 쓰는 공용 DB라 정지되면 안 된다.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -o /dev/null \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
